# Codemagic CI: builds & uploads Followers Check without needing a Mac.
# Setup steps are in docs/RELEASE_GUIDE.md (section "بدون جهاز Mac").
workflows:
  ios-release:
    name: iOS → TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # App Store Connect API key in Codemagic settings. The same team key
      # works for every app, so we reuse the one created for StoryCraft.
      app_store_connect: StoryCraft ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY (see docs/RELEASE_GUIDE.md).
        - ios_signing
      vars:
        BUNDLE_ID: com.followercheck.followerCheck
        # App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: 6817513531
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Checks
        script: |
          flutter analyze
          flutter test
      - name: Code signing
        script: |
          # Creates (first run) or reuses the distribution certificate and
          # App Store provisioning profile through the ASC integration.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # Next build number = latest TestFlight build + 1. If the lookup
          # fails (e.g. APP_STORE_APPLE_ID not set yet, or first upload), fall
          # back to Codemagic's own counter so numbers never repeat.
          if LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null) \
             && [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            BUILD=$((LATEST + 1))
          else
            BUILD=${PROJECT_BUILD_NUMBER:-1}
          fi
          echo "Build number: $BUILD"
          flutter build ipa --release \
            --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get every uploaded build without Beta App Review.
        # Set to true only after filling TestFlight → Test Information, to
        # also submit builds for external testing.
        submit_to_testflight: false

  android-release:
    name: Android → Google Play (internal testing)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      # Upload keystore added in Codemagic → Team → Code signing identities.
      android_signing:
        - followerscheck_upload_key
      groups:
        # Holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console service account JSON).
        - google_play
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Checks
        script: |
          flutter analyze
          flutter test
      - name: Signing properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build AAB
        script: flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
