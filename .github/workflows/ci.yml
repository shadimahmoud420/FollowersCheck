name: CI

on:
  push:
    branches: [badelha, main]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "select version()"
      - name: Migrations + swap flow tests
        run: |
          cp -r supabase /tmp/sb && sudo chown -R postgres /tmp/sb
          sudo -u postgres bash /tmp/sb/tests/run_tests.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK
        run: |
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: badelha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
